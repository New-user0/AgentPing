[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/New-user0/AgentPing"
rust-version = "1.85"

[workspace.dependencies]
agentping-core = { path = "crates/agentping-core", version = "0.1.0" }
agentping-storage = { path = "crates/agentping-storage", version = "0.1.0" }
agentping-rules = { path = "crates/agentping-rules", version = "0.1.0" }
agentping-notifiers = { path = "crates/agentping-notifiers", version = "0.1.0" }
agentping-agents = { path = "crates/agentping-agents", version = "0.1.0" }
agentping-daemon = { path = "crates/agentping-daemon", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
regex = "1"
url = "2"
globset = "0.4"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
anstream = "0.6"
anstyle = "1"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
keyring = "3"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
